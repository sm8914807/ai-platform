apiVersion: platform.ai/v1
kind: EvaluationSuite
metadata:
  name: support-quality
  namespace: default-org/default-project
  version: "1.0.0"
spec:
  dataset:
    - id: case-1
      input:
        message: billing invoice help
      expected:
        contains: billing
    - id: case-2
      input:
        message: reset my password
      expected:
        contains: password
  evaluators:
    - type: keyword_match
    - type: llm_judge
      criteria: quality
      metric: quality
    - type: faithfulness
    - type: latency
      maxP95Ms: 5000
  triggers:
    - onPublish: [agents/support-agent]
  gates:
    minScore: 0.5
    failIf: score < 0.5
    metrics:
      quality: 0.5
      keyword: 0.5

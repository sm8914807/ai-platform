name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
          POSTGRES_DB: ai_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d ai_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PLATFORM_TEST_DATABASE_URL: postgresql://platform:platform@localhost:5432/ai_platform
      PLATFORM_DATABASE_URL: postgresql://platform:platform@localhost:5432/ai_platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev,postgres]"
      - name: Postgres tests
        run: pytest -q tests/test_postgres_ci.py tests/test_hardening.py::test_postgres_registry_optional

  test-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci || npm install
      - run: npm run build

  console-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install API
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Install console + Playwright
        working-directory: console
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
      - name: Start API
        run: |
          mkdir -p /tmp/platform-e2e
          PLATFORM_AUTH_REQUIRED=true \
          PLATFORM_DB_PATH=/tmp/platform-e2e/registry.db \
          PLATFORM_AUTH_SECRET=e2e-ci-secret \
          PLATFORM_CORS_ORIGINS=http://127.0.0.1:5173,http://localhost:5173 \
          platform-api > /tmp/platform-e2e/api.log 2>&1 &
          echo $! > /tmp/platform-e2e/api.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"; cat /tmp/platform-e2e/api.log; exit 1
      - name: Playwright e2e
        working-directory: console
        env:
          CI: "true"
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            console/playwright-report
            console/test-results
          if-no-files-found: ignore
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/platform-e2e/api.pid ]; then kill "$(cat /tmp/platform-e2e/api.pid)" || true; fi

  docker:
    runs-on: ubuntu-latest
    needs: [test-python, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deploy/docker/Dockerfile -t ai-platform:ci .

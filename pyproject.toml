[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ai_platform*"]

[project]
name = "ai-platform"
version = "0.8.0"
description = "Enterprise AI platform — control plane, data plane, and runtime SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "jsonschema>=4.23.0",
  "cryptography>=43.0.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0",
  "aiosqlite>=0.20.0",
  "pyyaml>=6.0.2",
  "openapi-schema-validator>=0.6.0",
]

[project.optional-dependencies]
postgres = [
  "asyncpg>=0.30.0",
]
redis = [
  "redis>=5.0.0",
]
amtp = [
  "dnspython>=2.6.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "asyncpg>=0.30.0",
  "dnspython>=2.6.0",
  "redis>=5.0.0",
]

[project.scripts]
platform-api = "ai_platform.api.app:run"
platform = "ai_platform.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

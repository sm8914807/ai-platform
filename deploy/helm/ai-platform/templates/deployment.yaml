apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-platform.fullname" . }}
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ai-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "ai-platform.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ default (include "ai-platform.fullname" .) .Values.serviceAccount.name }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLATFORM_DB_PATH
              value: /data/registry.db
            - name: PLATFORM_DEFAULT_NAMESPACE
              value: {{ .Values.env.PLATFORM_DEFAULT_NAMESPACE | quote }}
            - name: PLATFORM_PRIMARY_REGION
              value: {{ .Values.env.PLATFORM_PRIMARY_REGION | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-platform.fullname" . }}-secrets
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-platform.fullname" . }}-secrets
                  key: anthropic-api-key
                  optional: true
            - name: BEDROCK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-platform.fullname" . }}-secrets
                  key: bedrock-api-key
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "ai-platform.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}

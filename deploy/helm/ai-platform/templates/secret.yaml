apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-platform.fullname" . }}-secrets
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  bedrock-api-key: {{ .Values.secrets.bedrockApiKey | quote }}
